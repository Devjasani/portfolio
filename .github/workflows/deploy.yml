# ══════════════════════════════════════════════════════════════════════════════
#  CI / CD — Dev Jasani Portfolio
#  Trigger: push to main → Build → Deploy to Cloudflare Pages
# ══════════════════════════════════════════════════════════════════════════════

name: 🚀 Build & Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:      # allows manual trigger from GitHub UI

# Cancel redundant runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build & Type Check
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build Portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 Install all workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔬 TypeScript type check
        run: pnpm run typecheck
        continue-on-error: false

      - name: 🏗️ Build production bundle
        run: pnpm --filter @workspace/portfolio run build
        env:
          NODE_ENV: production
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}

      # ── Upload the built dist/ as an artifact for the deploy job ─────────
      - name: 📤 Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: artifacts/portfolio/dist/
          if-no-files-found: error
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Deploy to Cloudflare Pages (only runs after build succeeds)
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: ☁️ Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    permissions:
      contents: read
      deployments: write
      pull-requests: write    # required to post preview URL on PRs

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download built dist
        uses: actions/download-artifact@v4
        with:
          name: portfolio-dist
          path: dist

      # ── Cloudflare Pages Deploy ───────────────────────────────────────────
      # Required GitHub Secrets:
      #   CLOUDFLARE_API_TOKEN  → Cloudflare Dashboard > API Tokens > Create Token
      #                           (use "Edit Cloudflare Workers" template or Pages:Edit)
      #   CLOUDFLARE_ACCOUNT_ID → Cloudflare Dashboard > right sidebar
      # ─────────────────────────────────────────────────────────────────────
      - name: 🌍 Deploy to Cloudflare Pages
        id: cf-deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: dev-jasani-portfolio      # ← must match your CF Pages project name
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref || github.ref_name }}

      # ── Post preview URL as PR comment ───────────────────────────────────
      - name: 💬 Post preview URL on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cf-deploy-preview
          message: |
            ## 🚀 Cloudflare Pages Preview Deployed

            | | |
            |---|---|
            | **Preview URL** | ${{ steps.cf-deploy.outputs.url }} |
            | **Branch** | `${{ github.head_ref }}` |
            | **Commit** | `${{ github.sha }}` |

            Preview is auto-deleted when the PR merges.
